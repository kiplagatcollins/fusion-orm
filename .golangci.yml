version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  settings:
    staticcheck:
      checks:
        - "SA*"
  enable:
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
